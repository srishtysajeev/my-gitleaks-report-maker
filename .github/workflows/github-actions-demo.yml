name: Build and Push Image

on:
  push:
    branches: [ dev-branch ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Log in to registry
        run: echo $CR_PAT | podman login ghcr.io -u srishtysajeev --password-stdin

      - name: Build image
        run: |
          IMAGE=ghcr.io/${{ github.repository }}:${{ github.sha }}
          podman build -t $IMAGE .

      - name: Push image
        run: |
          IMAGE=ghcr.io/${{ github.repository }}:${{ github.sha }}
          podnab push $IMAGE

      - name: Update manifests repo
        uses: actions/checkout@v4
        with:
          repository: your-org/manifests-repo
          token: ${{ secrets.MANIFESTS_REPO_TOKEN }}
          path: manifests

      - name: Update image tag
        run: |
          sed -i "s|image: .*|image: ghcr.io/${{ github.repository }}:${{ github.sha }}|" \
            manifests/base/deployment.yaml

      - name: Commit and push
        run: |
          cd manifests
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git commit -am "Update image to ${{ github.sha }}"
          git push
